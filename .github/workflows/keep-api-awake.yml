# Keep the API awake. Render's free plan stops the service after 15 minutes without requests,
# and the first visitor then waits 30-60 s while it starts (the site shows a "starting" notice).
# Calling /api/health every 10 minutes keeps it running. One always-on free service uses about
# 744 of the 750 free instance hours a month. GitHub sometimes starts scheduled runs late, so an
# occasional cold start can still happen; a paid Render plan (no sleeping) removes it entirely.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health endpoint
        run: |
          curl -fsS --max-time 120 --retry 2 --retry-delay 10 \
            https://airware-api.onrender.com/api/health -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
